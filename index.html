<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Faculty Fundamentals | Interactive Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .chart-container { position: relative; width: 100%; max-width: 800px; margin: 0 auto; height: 300px; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .interactive-card { transition: all 0.2s ease-in-out; }
        .video-overlay { background: rgba(15, 23, 42, 0.4); transition: background 0.3s ease; }
        .video-container:hover .video-overlay { background: rgba(15, 23, 42, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2 py-0.5 rounded uppercase">Google for Education</span>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900">Gemini Faculty Fundamentals</h1>
            </div>
            <div class="bg-emerald-50 px-4 py-2 rounded-lg border border-emerald-100">
                <div class="flex justify-between text-[10px] font-bold text-emerald-700 uppercase mb-1">
                    <span>Course Progress</span>
                    <span id="progress-text">0 / 13</span>
                </div>
                <div class="w-32 bg-emerald-200 rounded-full h-1.5">
                    <div id="progress-bar" class="bg-emerald-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-8">
        <!-- Explorer Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="flex flex-col lg:flex-row min-h-[600px]">
                <!-- Pane 1: Phases -->
                <div class="w-full lg:w-1/4 bg-slate-50 border-r border-slate-200 p-3 space-y-2">
                    <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-2 mb-2">Phases</h3>
                    <div id="phase-list" class="space-y-2"></div>
                </div>

                <!-- Pane 2: Modules -->
                <div class="w-full lg:w-1/3 border-r border-slate-200 p-3 space-y-2">
                    <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-2 mb-2" id="module-title">Modules</h3>
                    <div id="module-list" class="space-y-2"></div>
                </div>

                <!-- Pane 3: Detail -->
                <div class="w-full lg:w-5/12 bg-slate-50/30 p-6" id="module-detail">
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 text-center">
                        <p>Select a module to view video and activity.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const modulesData = [
            { id: 1, phase: 1, week: 1, title: 'The Curriculum Mapper', url: 'https://www.youtube.com/watch?v=kUq3B9R_rGo', activity: 'Use Gemini to map your syllabus against industry trends.' },
            { id: 2, phase: 1, week: 2, title: 'Meeting to Action Summary', url: 'https://www.youtube.com/watch?v=0-j-A61p104', activity: 'Summarize a transcript into a task table.' },
            { id: 3, phase: 1, week: 3, title: 'Guided Feedback Guardrails', url: 'https://www.youtube.com/watch?v=1F2WBC2a8gI', activity: 'Setup Gemini as a Socratic tutor for student drafts.' },
            { id: 4, phase: 2, week: 4, title: 'Live Literature Scan', url: 'https://www.youtube.com/watch?v=RiDkeAAAAZI', activity: 'Model real-time research using Gemini Deep Research.' },
            { id: 5, phase: 2, week: 5, title: 'The Research Brief Podcast', url: 'https://www.youtube.com/watch?v=Fmc6xKH2WfM', activity: 'Create an Audio Overview in NotebookLM.' },
            { id: 6, phase: 2, week: 6, title: 'The Socratic Tutor', url: 'https://www.youtube.com/watch?v=6S8-e6_e_h4', activity: 'Ground learning in specific course sources.' },
            { id: 7, phase: 3, week: 7, title: 'The Live Data Analyst', url: 'https://www.youtube.com/watch?v=fLM7bMTr2h4', activity: 'Clean and visualize data sets in real time.' },
            { id: 8, phase: 3, week: 8, title: 'Data Viz Infographic', url: 'https://www.youtube.com/watch?v=7V-w-6L_k74', activity: 'Design visual layouts for research stats.' },
            { id: 9, phase: 3, week: 9, title: 'Visualizing Abstract Concepts', url: 'https://www.youtube.com/watch?v=9P-X-o8_f74', activity: 'Generate visual metaphors for complex theories.' },
            { id: 10, phase: 4, week: 10, title: 'Seminar Spark / Guided Learning', url: 'https://www.youtube.com/watch?v=mu8CHJOz7No', activity: 'Use Guided Learning to spark seminar debates.' },
            { id: 11, phase: 4, week: 11, title: 'Pre-Submission Peer Review', url: 'https://www.youtube.com/watch?v=4P-o-9L_j74', activity: 'Automate rubric-based feedback.' },
            { id: 12, phase: 4, week: 12, title: 'Case Study Generator', url: 'https://www.youtube.com/watch?v=2V-k-L8_m74', activity: 'Create localized case studies for class.' },
            { id: 13, phase: 4, week: 13, title: 'Guest Speaker Debrief', url: 'https://www.youtube.com/watch?v=1F-z-G4_l74', activity: 'Synthesize lecture notes into reflection prompts.' }
        ];

        const phases = [
            { id: 1, name: "Efficiency", weeks: "1-3" },
            { id: 2, name: "Research", weeks: "4-6" },
            { id: 3, name: "Data Viz", weeks: "7-9" },
            { id: 4, name: "Engagement", weeks: "10-13" }
        ];

        let state = { phase: 1, module: null, completed: new Set() };

        function init() {
            renderPhases();
            renderModules();
        }

        function renderPhases() {
            const list = document.getElementById('phase-list');
            list.innerHTML = phases.map(p => `
                <button onclick="state.phase=${p.id}; state.module=null; renderPhases(); renderModules(); renderDetail();" 
                    class="w-full text-left p-3 rounded-lg border text-sm font-bold ${state.phase === p.id ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-white border-slate-200'}">
                    Phase ${p.id}: ${p.name}
                </button>
            `).join('');
        }

        function renderModules() {
            const list = document.getElementById('module-list');
            const filtered = modulesData.filter(m => m.phase === state.phase);
            list.innerHTML = filtered.map(m => `
                <div onclick="state.module=${m.id}; renderModules(); renderDetail();" 
                    class="p-3 rounded-lg border cursor-pointer flex items-center gap-3 transition-all ${state.module === m.id ? 'border-indigo-600 bg-indigo-50' : 'bg-white border-slate-200'}">
                    <span class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-[10px] font-bold">${m.week}</span>
                    <span class="text-sm font-medium ${state.completed.has(m.id) ? 'line-through opacity-50' : ''}">${m.title}</span>
                </div>
            `).join('');
        }

        function renderDetail() {
            const detail = document.getElementById('module-detail');
            const m = modulesData.find(mod => mod.id === state.module);
            if (!m) { detail.innerHTML = '<div class="text-center text-slate-400 mt-20">Select a module to view content.</div>'; return; }

            detail.innerHTML = `
                <div class="animate-in fade-in slide-in-from-bottom-2 duration-300">
                    <h2 class="text-xl font-bold text-slate-900 mb-2">${m.title}</h2>
                    <div class="aspect-video bg-slate-900 rounded-xl mb-6 relative group overflow-hidden flex items-center justify-center border border-slate-200 shadow-md">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 to-transparent"></div>
                        <a href="${m.url}" target="_blank" class="z-20 px-6 py-3 bg-white text-slate-900 rounded-full font-bold shadow-xl hover:scale-105 transition-transform flex items-center gap-2">
                            <span>▶</span> Watch Video
                        </a>
                        <p class="absolute bottom-4 left-4 text-white text-[10px] z-20">YouTube Tutorial • Week ${m.week}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <h4 class="font-bold text-slate-800 text-sm mb-2">Weekly Activity</h4>
                        <p class="text-slate-600 text-sm">${m.activity}</p>
                    </div>
                    <button onclick="toggleDone(${m.id})" class="w-full mt-6 py-3 rounded-xl font-bold ${state.completed.has(m.id) ? 'bg-slate-200 text-slate-500' : 'bg-emerald-500 text-white shadow-lg'}">
                        ${state.completed.has(m.id) ? 'Completed' : 'Mark as Done'}
                    </button>
                </div>
            `;
        }

        function toggleDone(id) {
            if (state.completed.has(id)) state.completed.delete(id);
            else state.completed.add(id);
            const percent = (state.completed.size / 13) * 100;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').textContent = `${state.completed.size} / 13`;
            renderModules();
            renderDetail();
        }

        window.onload = init;
    </script>
</body>
</html>
